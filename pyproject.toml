[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiec-core"
version = "0.1.0a0"
description = "Evidence-first, safety-gated collective agent reasoning prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "WIEC Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
adk = ["google-adk==2.15.1"]
microsoft = ["agent-framework-core==1.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
